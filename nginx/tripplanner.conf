server {
    listen 80;
    server_name casinowendle.com www.casinowendle.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name casinowendle.com www.casinowendle.com;

    # SSL certs (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/casinowendle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casinowendle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve static client files directly via nginx
    root /root/TripPlanner/client/dist;
    index index.html;

    # API requests → Node.js backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback — Vue Router HTML5 history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
